name: CI

# Build -> Test -> Analyze -> Security check.
# "Deploy" for the database is running supabase/schema.sql (it is safe to re-run); see docs/DEPLOY.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (rules, matching, lint, security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install tools
        run: pip install -r ml/requirements.txt "psycopg[binary]" ruff bandit pip-audit

      - name: Lint (ruff)
        run: ruff check ml supabase legacy-aws/backend

      - name: AWS backend tests (rules, phone privacy, emails, photo labels, handlers)
        run: |
          pip install -r legacy-aws/backend/requirements-dev.txt
          PYTHONPATH=legacy-aws/backend/tests:legacy-aws/backend/src python -m unittest discover -s legacy-aws/backend/tests

      - name: Database tests (row-level security, matching parity with Python, lifecycle)
        env:
          LF_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m unittest discover -s supabase/tests -v

      - name: ML pipeline smoke test (synthetic data, numbers are not real accuracy)
        working-directory: ml
        run: |
          python make_synthetic_pairs.py --groups 120 --orphans 60 --image-rate 0 --out data/pairs.csv
          python train_scorer.py --pairs data/pairs.csv --out out --synthetic

      - name: Static security analysis (bandit)
        run: bandit -q -r ml -ll

      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r ml/requirements.txt

  android:
    name: Android (unit tests, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25" # matches gradle/gradle-daemon-jvm.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests, lint, debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  secrets:
    name: Secret scan (the service_role key must never be committed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
