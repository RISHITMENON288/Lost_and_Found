version: 0.2
# Build stage: zips legacy-aws/backend/src, uploads it to the pipeline bucket and
# writes packaged.yaml (the template that CloudFormation deploys next).
env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
phases:
  build:
    commands:
      - >
        aws cloudformation package
        --template-file legacy-aws/backend/template.yaml
        --s3-bucket "$ARTIFACT_BUCKET"
        --output-template-file packaged.yaml
artifacts:
  files:
    - packaged.yaml
