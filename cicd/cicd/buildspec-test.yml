version: 0.2
# CI stage: lint, template check, unit tests, security scan. Any failing command stops the pipeline.
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r legacy-aws/backend/requirements-dev.txt
  build:
    commands:
      - ruff check legacy-aws/backend
      - cfn-lint -t legacy-aws/backend/template.yaml legacy-aws/backend/github-oidc.yaml cicd/pipeline.yaml -i W3002
      - PYTHONPATH=legacy-aws/backend/tests:legacy-aws/backend/src python -m unittest discover -s legacy-aws/backend/tests
      - bandit -q -r legacy-aws/backend/src -ll
